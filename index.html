<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд компании «Сеппра»</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }
header { background: #64748b; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
.hdr-brand { display: flex; align-items: center; gap: 14px; }
.hdr-brand h1 { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.hdr-user { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.85); font-size: 12px; }
.hdr-user button { background: none; border: 1px solid rgba(255,255,255,.35); color: rgba(255,255,255,.85); border-radius: 5px; padding: 4px 6px; cursor: pointer; display: flex; align-items: center; }
.hdr-user button:hover { background: rgba(255,255,255,.12); }
.content { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
.content h2 { font-size: 15px; font-weight: 600; color: #555; margin-bottom: 18px; }
.widgets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.widget { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 20px 22px; text-decoration: none; color: inherit; display: block; transition: box-shadow .15s, transform .15s; }
a.widget:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
.widget-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.widget-icon { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.widget-icon.green { background: #eceef1; color: #4b5563; }
.widget-title { font-size: 14px; font-weight: 600; color: #222; }
.widget-sub { font-size: 11px; color: #999; margin-top: 2px; }
.widget-stats { display: flex; gap: 18px; }
.ws { min-width: 60px; }
.ws-val { font-size: 22px; font-weight: 700; color: #374151; }
.ws-lbl { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.widget-empty { color: #bbb; font-size: 12px; }
.widget.soon { opacity: .55; border: 2px dashed #ddd; box-shadow: none; background: transparent; display: flex; align-items: center; justify-content: center; min-height: 130px; color: #999; font-size: 13px; }
/* Auth */
.auth-overlay { position: fixed; inset: 0; background: #f0f2f5; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.auth-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); padding: 36px 40px; width: 360px; text-align: center; }
.auth-card .auth-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 6px; }
.auth-card h2 { font-size: 15px; font-weight: 600; color: #374151; letter-spacing: .02em; }
.auth-card .auth-sub { font-size: 12px; color: #888; margin: 10px 0 22px; line-height: 1.5; }
.auth-card input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 14px; margin-bottom: 12px; outline: none; }
.auth-card input:focus { border-color: #64748b; }
.auth-card button { width: 100%; padding: 10px; background: #4b5563; color: #fff; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
.auth-card button:hover { background: #374151; }
.auth-card button:disabled { opacity: .5; cursor: default; }
.auth-forgot { margin-top: 12px; }
.auth-forgot button { width: auto; padding: 0; background: none; color: #64748b; font-size: 12px; font-weight: 500; text-decoration: underline; }
.auth-forgot button:hover { background: none; color: #374151; }
.auth-msg { font-size: 12px; margin-top: 14px; line-height: 1.5; display: none; }
.auth-msg.ok { color: #374151; display: block; }
.auth-msg.fail { color: #c0392b; display: block; }
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 2650 500" width="180" xmlns="http://www.w3.org/2000/svg" fill="#2E2D7C">
        <path d="M1384.2,250.4c0-62-38.4-85.8-119.5-85.8c-81,0-119,23.8-119,85.8c0,61.5,37.9,85.3,119,85.3 C1345.8,335.7,1384.2,311.9,1384.2,250.4 M1474.8,250.4c0,119.2-85.3,161-185.9,161c-67.3,0-109.9-15.1-143.1-42.9v123.3h-91.1V94.2h91.1v37.6 c36.8-30.1,75.8-42.9,143.1-42.9C1389.5,88.9,1474.8,131.2,1474.8,250.4"/>
        <path d="M1840.3,250.4c0-62-38.4-85.8-119.5-85.8c-81,0-119,23.8-119,85.8c0,61.5,37.9,85.3,119,85.3 S1840.3,311.9,1840.3,250.4 M1930.9,250.4c0,119.2-79.2,161-179.9,161c-67.3,0-116-15.1-149.2-42.9v123.3h-91.1V94.2h91.1v37.6 c36.8-30.1,81.9-42.9,149.2-42.9C1851.6,88.9,1930.9,131.2,1930.9,250.4"/>
        <path d="M2512.4,277.1h-182.2c-13.9,0-49.2,3.2-49.2,31.2c0,33.5,41.3,33.5,51.1,33.5h180.3L2512.4,277.1L2512.4,277.1z M2597.5,236.4v169.7h-253.4c-87.4,0-143.7-21.7-143.7-96.2c0-82.7,66.1-96.2,143.7-96.2h168.3c0-22.2,1.3-50-84.9-50l-186.3,0.1V94h153 C2547.1,94,2596.4,122.1,2597.5,236.4"/>
        <path d="M2207.4,88.2c-2.4,0.8-150,41.6-150,41.6V94.2h-90.6v312h90.6V205.3l150-39.6V88.2z"/>
        <path d="M468.3,204.2H109.7c-9.9,0-21.1-6.5-21.1-22.6c0-18.9,12.7-21.6,24.2-24C123,155.6,554,90.2,554,90.2V1.2L101.2,69 c0,0-94.8,14.2-94.8,111.7c6.4,97,96.2,102.2,96.2c18.8-0.1,351.4,0,357.6,0c10,0,20.2,9.6,20.7,23.6c0.6,18.8-12.7,23.6-24.2,26 C446.5,334.6,0,409.8,0,409.8v89.1l465.1-86.3c0,0,104.5-11.4,104.4-98.5C569.4,198.3,468.3,204.2,468.3,204.2"/>
        <path d="M810.8,157.7c57.2,0,101.7,12.2,117.1,56.2H691C705.3,169.9,748.8,157.7,810.8,157.7 M919.7,305.8 c-23.4,23.2-59.3,32-113.7,32c-60.4,0-112.5-11-122.6-60.8h336.9c0-142-90.3-188.1-209-188.1c-126.6,0-216.1,46.6-216.1,161.6 c0,114.4,92.2,161,210.8,161c109.8,0,185.1-34,210-105.7L919.7,305.8L919.7,305.8z"/>
      </svg>
      <h2>Дашборд компании &laquo;Сеппра&raquo;</h2>
    </div>
    <div class="auth-sub">Введите email и пароль, выданные администратором.</div>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password">
    <button id="authBtn" onclick="signIn()">Войти</button>
    <div class="auth-forgot"><button type="button" id="forgotBtn" onclick="resetPassword()">Забыли пароль?</button></div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>
<header>
  <div class="hdr-brand">
    <h1>Дашборд компании</h1>
  </div>
  <div class="hdr-user" id="hdrUser" style="display:none">
    <span id="userEmail"></span>
    <button onclick="signOut()" title="Выйти"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
</header>
<div class="content">
  <h2>Отчёты</h2>
  <div class="widgets">
    <a class="widget" href="call-center-kpi/">
      <div class="widget-head">
        <div class="widget-icon green">
          <svg width="20" height="22" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17v-5a9 9 0 0 1 18 0v5"/>
            <path d="M21 18a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
            <path d="M3 18a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
            <path d="M7 20 Q7 25 12 25"/>
            <circle cx="12" cy="25" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div>
          <div class="widget-title">Отчёт колл-центра</div>
          <div class="widget-sub" id="ccSub">текущий месяц</div>
        </div>
      </div>
      <div class="widget-stats" id="ccStats">
        <span class="widget-empty">Загрузка…</span>
      </div>
    </a>
    <div class="widget soon">+ следующий отчёт скоро</div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut as firebaseSignOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

// Вставьте сюда конфигурацию из Firebase Console → Project settings → Your apps.
const firebaseConfig = {
  apiKey: "AIzaSyBD4R9Z3XYg9djAp3drsooW2SmK3g4o7yc",
  authDomain: "seppra-dashboard.firebaseapp.com",
  projectId: "seppra-dashboard",
  storageBucket: "seppra-dashboard.firebasestorage.app",
  messagingSenderId: "121760808159",
  appId: "1:121760808159:web:54ed2bb84c69766c7ffd6a",
  measurementId: "G-BJWJDP3PDV"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showMessage(text, type = 'fail') {
  const msg = document.getElementById('authMsg');
  msg.textContent = text;
  msg.className = 'auth-msg ' + type;
}

function friendlyAuthError(error) {
  switch (error?.code) {
    case 'auth/invalid-email':
      return 'Проверьте адрес электронной почты.';
    case 'auth/invalid-credential':
    case 'auth/user-not-found':
    case 'auth/wrong-password':
      return 'Неверный email или пароль.';
    case 'auth/too-many-requests':
      return 'Слишком много попыток входа. Попробуйте немного позже.';
    case 'auth/network-request-failed':
      return 'Не удалось подключиться к Firebase. Проверьте интернет.';
    case 'auth/missing-email':
      return 'Введите адрес электронной почты.';
    default:
      return 'Не удалось войти. Проверьте email и пароль.';
  }
}

async function signIn() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authBtn');

  if (!email || !password) {
    showMessage('Введите email и пароль.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Входим…';
  document.getElementById('authMsg').className = 'auth-msg';

  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    showMessage(friendlyAuthError(error));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
}

async function resetPassword() {
  const email = document.getElementById('authEmail').value.trim();
  const btn = document.getElementById('forgotBtn');

  if (!email || !email.includes('@')) {
    showMessage('Сначала введите email, на который зарегистрирован аккаунт.');
    document.getElementById('authEmail').focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Отправляем…';

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage('Письмо для смены пароля отправлено на ' + email + '. Проверьте также папку «Спам».', 'ok');
  } catch (error) {
    // Не раскрываем, зарегистрирован ли такой адрес.
    if (error?.code === 'auth/invalid-email') {
      showMessage('Проверьте адрес электронной почты.');
    } else if (error?.code === 'auth/too-many-requests') {
      showMessage('Слишком много запросов. Попробуйте немного позже.');
    } else if (error?.code === 'auth/network-request-failed') {
      showMessage('Не удалось подключиться к Firebase. Проверьте интернет.');
    } else {
      showMessage('Если этот email зарегистрирован, на него будет отправлено письмо для смены пароля.', 'ok');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Забыли пароль?';
  }
}

async function signOut() {
  await firebaseSignOut(auth);
}

function showDashboard(user) {
  document.getElementById('authOverlay').style.display = 'none';
  const hu = document.getElementById('hdrUser');
  hu.style.display = 'flex';
  document.getElementById('userEmail').textContent = user.email || '';
  if (!window._hubStarted) {
    window._hubStarted = true;
    loadWidgets();
  }
}

function showLogin() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('hdrUser').style.display = 'none';
}

window.signIn = signIn;
window.resetPassword = resetPassword;
window.signOut = signOut;

document.getElementById('authEmail').addEventListener('keydown', event => {
  if (event.key === 'Enter') document.getElementById('authPassword').focus();
});
document.getElementById('authPassword').addEventListener('keydown', event => {
  if (event.key === 'Enter') signIn();
});

onAuthStateChanged(auth, user => {
  if (user) showDashboard(user);
  else showLogin();
});

// ---------- WIDGETS ----------
async function loadWidgets() {
  const stats = document.getElementById('ccStats');
  try {
    const r = await fetch('data/cache.json?t=' + Date.now());
    if (!r.ok) throw new Error('no cache');
    const data = await r.json();
    // Текущий месяц
    const now = new Date();
    const mFrom = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const mTo   = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
    const inMonth = iso => { if (!iso) return false; const t = new Date(iso).getTime(); return t >= mFrom && t < mTo; };
    // Считаем касания только по ЛИДам из выборки — как в отчёте
    const lidIds = new Set((data.lids || []).map(l => l.id));
    let calls = 0, lpr = 0;
    for (const k of (data.kasaniya || [])) {
      if (!lidIds.has(k.taskId)) continue;
      if (!inMonth(k.date)) continue;
      if (k.isCall) calls++;
      if (k.isLPR)  lpr++;
    }
    let reqs = 0;
    for (const id in (data.requests || {})) {
      if (inMonth(data.requests[id].created)) reqs++;
    }
    let targets = 0;
    for (const l of (data.lids || [])) {
      if (!l.qualDate) continue;
      const p = l.qualDate.split('-'); // DD-MM-YYYY
      if (p.length === 3 && inMonth(`${p[2]}-${p[1]}-${p[0]}T00:00:00`)) targets++;
    }
    const MO = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    document.getElementById('ccSub').textContent = MO[now.getMonth()] + ' ' + now.getFullYear() + (data.updated ? ' · данные: ' + data.updated : '');
    stats.innerHTML = `
      <div class="ws"><div class="ws-val">${calls}</div><div class="ws-lbl">Дозвонов</div></div>
      <div class="ws"><div class="ws-val">${lpr}</div><div class="ws-lbl">до ЛПР</div></div>
      <div class="ws"><div class="ws-val">${targets}</div><div class="ws-lbl">Целевых</div></div>
      <div class="ws"><div class="ws-val">${reqs}</div><div class="ws-lbl">Запросов</div></div>
    `;
  } catch (e) {
    stats.innerHTML = '<span class="widget-empty">Данные появятся после первой синхронизации</span>';
  }
}

</script>
</body>
</html>
