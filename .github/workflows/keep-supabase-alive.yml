name: Keep Supabase Alive

on:
  schedule:
    # Каждый день в 09:17 UTC
    - cron: "17 9 * * *"

  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            "${SUPABASE_URL}/rest/v1/keep_alive?id=eq.1&select=id,last_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

          echo
          echo "Supabase database query completed successfully."
