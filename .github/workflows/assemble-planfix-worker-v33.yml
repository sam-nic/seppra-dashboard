name: Apply Planfix Claude Worker v33

on:
  push:
    paths:
      - 'proxy/claude/v33.patch'
      - '.github/workflows/assemble-planfix-worker-v33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v33 patch
        run: |
          git apply --check proxy/claude/v33.patch
          git apply proxy/claude/v33.patch
          node --check proxy/claude/src/index.js
          grep -q 'const APP_VERSION = "33-2026-08-13"' proxy/claude/src/index.js
          grep -q 'function normalizeMasterInstructionUrls' proxy/claude/src/index.js
      - name: Commit updated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/claude/src/index.js
          git commit -m "Update Planfix Claude worker to v33"
          git push
