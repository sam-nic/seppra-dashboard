name: Assemble Planfix Claude Worker v33

on:
  push:
    paths:
      - 'worker/upload_v33/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble file
        run: |
          mkdir -p worker/downloads
          cat worker/upload_v33/part*.txt > worker/downloads/planfix-claude-worker-v33.js
          node --check worker/downloads/planfix-claude-worker-v33.js
      - name: Commit assembled file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/downloads/planfix-claude-worker-v33.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assemble Planfix Claude worker v33"
          git push
