name: Apply Planfix Claude Worker v35

on:
  push:
    paths:
      - '.github/workflows/apply-planfix-worker-v35.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update worker
        run: python proxy/claude/apply_v35.py
      - name: Validate worker
        run: |
          node --check proxy/claude/src/index.js
          grep -q 'const APP_VERSION = "35-2026-08-13"' proxy/claude/src/index.js
          grep -q '\[CLAUDE\].*REQUEST' proxy/claude/src/index.js
          grep -q '\[CLAUDE\].*RESPONSE' proxy/claude/src/index.js
      - name: Commit updated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/claude/src/index.js
          git commit -m "Add Claude interaction logging to v35"
          git push

# rerun after updater fix
