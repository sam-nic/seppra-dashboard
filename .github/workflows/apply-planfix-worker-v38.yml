name: Apply Planfix Claude Worker v38

on:
  push:
    paths:
      - '.github/workflows/apply-planfix-worker-v38.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('proxy/claude/src/index.js')
          s = p.read_text()

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected block not found:\n' + old[:500])
              s = s.replace(old, new, 1)

          rep('const APP_VERSION = "37-2026-08-13";', 'const APP_VERSION = "38-2026-08-13";')

          marker = '''function getMasterSectionDiagnosticSnippet(\n'''
          helper = r'''function buildMarkdownListAwareRegExp(
  value,
  flags = "g"
) {
  const lines = String(value || "")
    .trim()
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);

  if (lines.length === 0) {
    return null;
  }

  const optionalListPrefix =
    "(?:[ \\t]*(?:[-*+]\\s+|\\d+[.)]\\s+))?";

  const source = lines
    .map((line) =>
      optionalListPrefix +
      line
        .split(/\s+/)
        .map(escapeRegExp)
        .join("\\s+")
    )
    .join("\\s*(?:\\r?\\n)+\\s*");

  return new RegExp(source, flags);
}

function getMarkdownLinePrefix(line) {
  const match = String(line || "").match(
    /^([ \\t]*(?:[-*+]\\s+|\\d+[.)]\\s+))/
  );

  return match ? match[1] : "";
}

function formatProposedTextForMatchedMarkdown(
  matchedMarkdown,
  proposedText
) {
  const matchedLines = String(matchedMarkdown || "")
    .split(/\r?\n/)
    .filter((line) => line.trim());

  const proposedLines = String(proposedText || "")
    .trim()
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);

  if (proposedLines.length === 0) {
    return "";
  }

  const prefixes = matchedLines
    .map(getMarkdownLinePrefix)
    .filter(Boolean);

  if (prefixes.length === 0) {
    return proposedText;
  }

  const defaultPrefix = prefixes[0];

  return proposedLines
    .map((line, index) =>
      `${prefixes[index] || defaultPrefix}${line}`
    )
    .join("\n");
}

'''
          if marker not in s:
              raise SystemExit('Diagnostic marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = r'''  const matches = [
    ...markdown.matchAll(
      flexiblePattern
    )
  ];

  console.log(
'''
          new = r'''  const matches = [
    ...markdown.matchAll(
      flexiblePattern
    )
  ];

  const markdownListPattern =
    buildMarkdownListAwareRegExp(
      currentText,
      "g"
    );

  const markdownListMatches =
    markdownListPattern
      ? [...markdown.matchAll(markdownListPattern)]
      : [];

  console.log(
'''
          rep(old, new)

          rep('''        flexible_matches: matches.length,\n        currentText\n''', '''        flexible_matches: matches.length,\n        markdown_list_matches: markdownListMatches.length,\n        currentText\n''')

          old = r'''  if (matches.length !== 1) {
    console.error(
'''
          new = r'''  if (matches.length !== 1) {
    if (markdownListMatches.length === 1) {
      console.log(
        `[${taskNo}][MASTER APPLY] MATCH MODE: markdown-list-aware`
      );

      const markdownMatch = markdownListMatches[0];
      const markdownStart = markdownMatch.index;
      const markdownEnd =
        markdownStart + markdownMatch[0].length;

      const formattedProposedText =
        formatProposedTextForMatchedMarkdown(
          markdownMatch[0],
          proposedText
        );

      return (
        markdown.slice(0, markdownStart) +
        formattedProposedText +
        markdown.slice(markdownEnd)
      );
    }

    console.error(
'''
          rep(old, new)

          rep('''          flexible_matches: matches.length,\n          currentText,\n''', '''          flexible_matches: matches.length,\n          markdown_list_matches: markdownListMatches.length,\n          currentText,\n''')

          p.write_text(s)
          PY
      - name: Validate worker
        run: |
          node --check proxy/claude/src/index.js
          grep -q 'const APP_VERSION = "38-2026-08-13"' proxy/claude/src/index.js
          grep -q 'MATCH MODE: markdown-list-aware' proxy/claude/src/index.js
          grep -q 'markdown_list_matches' proxy/claude/src/index.js
      - name: Commit updated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/claude/src/index.js
          git commit -m "Add markdown-aware master matching v38"
          git push
