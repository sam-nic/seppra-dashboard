name: Apply Planfix Claude Worker v37

on:
  push:
    paths:
      - '.github/workflows/apply-planfix-worker-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update worker
        run: python proxy/claude/apply_v37.py
      - name: Validate worker
        run: |
          node --check proxy/claude/src/index.js
          grep -q 'const APP_VERSION = "37-2026-08-13"' proxy/claude/src/index.js
          grep -q 'function decodeHtmlEntities' proxy/claude/src/index.js
          grep -q 'decodeHtmlEntities(' proxy/claude/src/index.js
          grep -q '\[MASTER APPLY\] MATCH CHECK' proxy/claude/src/index.js
      - name: Commit updated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/claude/src/index.js
          git commit -m "Decode HTML entities in master updates v37"
          git push
