name: Update Planfix Cache

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 06:00 UTC (09:00 МСК)
  workflow_dispatch:        # ручной запуск из GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data from Planfix
        env:
          PLANFIX_TOKEN: ${{ secrets.SEPPRA_PLANFIX_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Upload cache to dashboard Worker (data is no longer committed to the public repo)
        env:
          DASHBOARD_ADMIN_KEY: ${{ secrets.DASHBOARD_ADMIN_KEY }}
        run: |
          curl --fail-with-body -sS -X PUT https://dashboard-seppra.api.misterfix.net/admin/cache.json \
            -H "X-Admin-Key: $DASHBOARD_ADMIN_KEY" -H "Content-Type: application/json" \
            --data-binary @data/cache.json
