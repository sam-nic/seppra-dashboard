name: Apply Planfix Claude Worker v36

on:
  push:
    paths:
      - '.github/workflows/apply-planfix-worker-v36.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update worker
        run: python proxy/claude/apply_v36.py
      - name: Validate worker
        run: |
          node --check proxy/claude/src/index.js
          grep -q 'const APP_VERSION = "36-2026-08-13"' proxy/claude/src/index.js
          grep -q '\[MASTER APPLY\] MATCH CHECK' proxy/claude/src/index.js
          grep -q '\[MASTER APPLY\] ERROR MESSAGE' proxy/claude/src/index.js
      - name: Commit updated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/claude/src/index.js
          git commit -m "Add master apply diagnostics to v36"
          git push
