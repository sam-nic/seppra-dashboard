<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Воронка продаж — Seppra</title>
<style>
:root{
  --bg:#F0F2F5; --surface:#FFFFFF; --ink:#1F2937; --ink2:#4B5563; --muted:#6B7280; --line:#DEE0EC; --grid:#E8EAF3;
  --brand:#475569; --brand-soft:#E8EAEE; --brand-dim:#A9B0BC; --accent:#D9531E;
  --good:#1E7F4F; --good-bg:#E1F2E9; --warn:#9A6200; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE4E1; --na:#6B7280; --na-bg:#ECEEF1;
  --f-disp:'Segoe UI',system-ui,sans-serif; --f-body:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:66ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;background:currentColor}
.pill.good{color:var(--good);background:var(--good-bg)} .pill.good::before{border-radius:50%}
.pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.warn::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.na{color:var(--na);background:var(--na-bg)} .pill.na::before{border-radius:50%;background:none;border:2px solid currentColor}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .v{font-size:30px;font-weight:700;line-height:1.1}
.card .v small{font-size:14px;font-weight:500;color:var(--ink2)}
.card .t{font-size:12.5px;color:var(--ink2)}
.card .act{font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.card .act b{color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart text.val{fill:var(--ink);font-family:var(--f-disp);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--na-bg);color:var(--na);white-space:nowrap}
.tag.g{background:var(--good-bg);color:var(--good)}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
[hidden]{display:none!important}
.ex{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.err{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:13px;white-space:pre-wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.sub2{font-size:12.5px;color:var(--muted)}
ul.f{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}

header { background: #64748b; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.hdr-title h1 { font-size: 17px; font-weight: 600; white-space: nowrap; letter-spacing: 0; }

/* Auth */
.auth-overlay { position: fixed; inset: 0; background: #f0f2f5; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.auth-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); padding: 36px 40px; width: 360px; text-align: center; }
.auth-card .auth-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 6px; }
.auth-card h2 { font-size: 15px; font-weight: 600; color: #374151; letter-spacing: .02em; }
.auth-card .auth-sub { font-size: 12px; color: #888; margin: 10px 0 22px; line-height: 1.5; }
.auth-card input[type=email],
.auth-card input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 14px; margin-bottom: 12px; outline: none; }
.auth-card input[type=email]:focus,
.auth-card input[type=password]:focus { border-color: #64748b; }
.auth-card button { width: 100%; padding: 10px; background: #4b5563; color: #fff; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
.auth-card button:hover { background: #374151; }
.auth-card button:disabled { opacity: .5; cursor: default; }
.auth-card .forgot-btn { margin-top: 10px; padding: 4px; background: none; color: #64748b; font-size: 12px; font-weight: 500; }
.auth-card .forgot-btn:hover { background: none; color: #374151; text-decoration: underline; }
.auth-msg { font-size: 12px; margin-top: 14px; line-height: 1.5; display: none; }
.auth-msg.ok { color: #374151; display: block; }
.auth-msg.fail { color: #c0392b; display: block; }
.hdr-user { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.85); font-size: 12px; }
.hdr-user button { background: none; border: 1px solid rgba(255,255,255,.35); color: rgba(255,255,255,.85); border-radius: 5px; padding: 4px 6px; cursor: pointer; display: flex; align-items: center; }
.hdr-user button:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body style="padding:0">
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 2650 500" width="180" xmlns="http://www.w3.org/2000/svg" fill="#2E2D7C">
        <path d="M1384.2,250.4c0-62-38.4-85.8-119.5-85.8c-81,0-119,23.8-119,85.8c0,61.5,37.9,85.3,119,85.3 C1345.8,335.7,1384.2,311.9,1384.2,250.4 M1474.8,250.4c0,119.2-85.3,161-185.9,161c-67.3,0-109.9-15.1-143.1-42.9v123.3h-91.1V94.2h91.1v37.6 c36.8-30.1,75.8-42.9,143.1-42.9C1389.5,88.9,1474.8,131.2,1474.8,250.4"/>
        <path d="M1840.3,250.4c0-62-38.4-85.8-119.5-85.8c-81,0-119,23.8-119,85.8c0,61.5,37.9,85.3,119,85.3 S1840.3,311.9,1840.3,250.4 M1930.9,250.4c0,119.2-79.2,161-179.9,161c-67.3,0-116-15.1-149.2-42.9v123.3h-91.1V94.2h91.1v37.6 c36.8-30.1,81.9-42.9,149.2-42.9C1851.6,88.9,1930.9,131.2,1930.9,250.4"/>
        <path d="M2512.4,277.1h-182.2c-13.9,0-49.2,3.2-49.2,31.2c0,33.5,41.3,33.5,51.1,33.5h180.3L2512.4,277.1L2512.4,277.1z M2597.5,236.4v169.7h-253.4c-87.4,0-143.7-21.7-143.7-96.2c0-82.7,66.1-96.2,143.7-96.2h168.3c0-22.2,1.3-50-84.9-50l-186.3,0.1V94h153 C2547.1,94,2596.4,122.1,2597.5,236.4"/>
        <path d="M2207.4,88.2c-2.4,0.8-150,41.6-150,41.6V94.2h-90.6v312h90.6V205.3l150-39.6V88.2z"/>
        <path d="M468.3,204.2H109.7c-9.9,0-21.1-6.5-21.1-22.6c0-18.9,12.7-21.6,24.2-24C123,155.6,554,90.2,554,90.2V1.2L101.2,69 c0,0-94.8,14.2-94.8,111.7c6.4,97,96.2,102.2,96.2,102.2c18.8-0.1,351.4,0,357.6,0c10,0,20.2,9.6,20.7,23.6c0.6,18.8-12.7,23.6-24.2,26 C446.5,334.6,0,409.8,0,409.8v89.1l465.1-86.3c0,0,104.5-11.4,104.4-98.5C569.4,198.3,468.3,204.2,468.3,204.2"/>
        <path d="M810.8,157.7c57.2,0,101.7,12.2,117.1,56.2H691C705.3,169.9,748.8,157.7,810.8,157.7 M919.7,305.8 c-23.4,23.2-59.3,32-113.7,32c-60.4,0-112.5-11-122.6-60.8h336.9c0-142-90.3-188.1-209-188.1c-126.6,0-216.1,46.6-216.1,161.6 c0,114.4,92.2,161,210.8,161c109.8,0,185.1-34,210-105.7L919.7,305.8L919.7,305.8z"/>
      </svg>
      <h2>Дашборд компании &laquo;Сеппра&raquo;</h2>
    </div>
    <div class="auth-sub">Доступ только для трёх сотрудников. Вход через ваш аккаунт Planfix (seppra).</div>
    <button id="authBtn" onclick="PF_login()">Войти через Planfix</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>
<header>
  <div class="hdr-title"><h1>Воронка продаж</h1></div>
  <div class="hdr-user" id="hdrUser" style="display:none">
    <span id="userEmail"></span>
    <button onclick="signOut()" title="Выйти"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
</header>

<main style="padding:20px 16px 40px">

<div class="wrap">
  <div>
    <div class="lbl">Стратегия ПМО</div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="stack" id="content">
    <div class="ex" id="stub" hidden></div>
    <div class="cards" id="f-cards"></div>
    <div class="panel"><div class="head"><h2>ВМ по этапам воронки</h2><span class="sub" id="chart-sub" style="margin:0"></span></div><div id="f-chart"></div></div>
    <div class="panel"><div class="head"><h2>Детали в КП без ответа клиента</h2><span class="sub" id="f-s" style="margin:0"></span></div><div class="tw" id="f-t"></div>
      <div class="hint" id="f-hint"></div></div>
    <div class="panel"><h2>Поля реестра воронки</h2><ul class="f" id="f-notes"></ul></div>
  </div>
</div>

</main>
<script>

/* ============================================================================
   DATA: единственный источник данных страницы. Страница рисуется только из него.
   Каждый блок ниже сейчас ЗАГЛУШКА с условными значениями.
   Описание полей, формул и формат: ОПИСАНИЕ_ВОРОНКИ.md
   Деньги везде: валовая маржа (ВМ), ₽ в месяц, без НДС. Часы: часы наладчика в месяц.
   ============================================================================ */
const DATA = {

  // ЗАГЛУШКА: служебные сведения
  meta: {
    title: 'Воронка потока ПМО',
    asOf: '31.10.2026',      // дата среза, дд.мм.гггг. Месяц этой даты = «текущий месяц» для потоков «за месяц»
    isStub: true             // true: показывать плашку «данные условные»
  },

  // ЗАГЛУШКА: параметры и нормативы
  params: {
    fundHours: 930,          // фонд часов наладчиков в месяц, ч (знаменатель «% фонда»)
    goalVmPerHour: 12000,    // целевая ВМ на час наладчика, ₽/ч (порог метки «≥ цели» в таблице)
    unitVm: 144000,          // условная единица по ВМ, ₽ ВМ в месяц
    unitHours: 12,           // условная единица по часам, ч наладчика в месяц
    stockNormVm: 650000,     // норма запаса: нижняя граница суммарной ВМ «КП без ответа», ₽ в месяц
    convWindowMonths: 3      // окно конверсии КП → номинация, месяцев (скользящее)
  },

  // ЗАГЛУШКА: стадия «Запросы». Срез на asOf
  requests: {
    parts: 22,               // деталей в запросах на дату среза (справочно)
    vm: 1150000,             // суммарная потенциальная ВМ, ₽ в месяц
    hours: 128,              // суммарные часы наладчика, ч в месяц
    inflowParts: 7           // поступило деталей за текущий месяц
  },

  // ЗАГЛУШКА: стадия «КП без ответа». Срез на asOf. Одна запись = одна деталь.
  // Итоги по стадии (деталей, ВМ, часы) страница считает сама как сумму списка.
  kpOpen: [
    { part: 'Деталь А (пример)', channel: 'Действующие клиенты', daysInKp: 12, vm: 168000, hours: 14 },
    { part: 'Деталь Б (пример)', channel: 'Вне автопрома',       daysInKp: 31, vm:  96000, hours: 10 },
    { part: 'Деталь В (пример)', channel: 'Действующие клиенты', daysInKp:  5, vm: 150000, hours: 16 },
    { part: 'Деталь Г (пример)', channel: 'Вне автопрома',       daysInKp: 44, vm:  72000, hours:  9 },
    { part: 'Деталь Д (пример)', channel: 'Другое',              daysInKp: 19, vm: 210000, hours: 22 },
    { part: 'Деталь Е (пример)', channel: 'Действующие клиенты', daysInKp:  8, vm:  88000, hours:  8 }
  ],

  // ЗАГЛУШКА: стадия «КП выдано». Поток за текущий месяц
  kpIssuedMonth: { parts: 3, vm: 420000, hours: 38 },

  // ЗАГЛУШКА: стадия «Номинации». Поток за текущий месяц
  nominationsMonth: { parts: 2, vm: 290000, hours: 24 },

  // ЗАГЛУШКА: стадия «Переведено в ППП». Поток за текущий месяц
  pppMonth: { parts: 1, vm: 150000, hours: 16 },

  // ЗАГЛУШКА: сырьё для конверсии КП → номинация. Суммы ВМ за окно params.convWindowMonths месяцев
  conversion: {
    nominationsVm: 610000,   // ВМ номинаций, поступивших в окне, ₽ в месяц
    kpIssuedVm: 2900000      // ВМ КП, выданных в окне, ₽ в месяц
  },

  // ЗАГЛУШКА: текст справочной панели «Поля реестра воронки»
  registryNotes: [
    'Одна строка — одна деталь в запросе. Идентификаторы: ID запроса, ID позиции (уникальный ключ строки), номер КП. Клиент, сегмент.',
    'Этап: запрос, КП, номинация, проект подготовки производства (ППП), серия, отказ. Дата входа в каждый этап.',
    'Из калькуляции: объём в месяц, ВМ на штуку, время цикла, K, размер серии. ВМ в месяц и часы наладчика считаются по ним.',
    'Причина отказа или потери.'
  ]
};

/* ===== проверка данных ===== */
function validate(D){
  const miss=[];
  const need=(o,path,keys)=>keys.forEach(k=>{if(o==null||typeof o[k]!=='number'||!isFinite(o[k]))miss.push(path+'.'+k+' (число)');});
  if(!D||typeof D!=='object')return ['DATA'];
  if(!D.meta||typeof D.meta.asOf!=='string')miss.push('meta.asOf (строка дд.мм.гггг)');
  need(D.params,'params',['fundHours','goalVmPerHour','unitVm','unitHours','stockNormVm','convWindowMonths']);
  need(D.requests,'requests',['parts','vm','hours','inflowParts']);
  ['kpIssuedMonth','nominationsMonth','pppMonth'].forEach(k=>need(D[k],k,['parts','vm','hours']));
  need(D.conversion,'conversion',['nominationsVm','kpIssuedVm']);
  if(!Array.isArray(D.kpOpen))miss.push('kpOpen (массив)');
  else D.kpOpen.forEach((r,i)=>{need(r,'kpOpen['+i+']',['daysInKp','vm','hours']);if(typeof r.part!=='string'||typeof r.channel!=='string')miss.push('kpOpen['+i+'].part/channel (строки)');});
  if(!Array.isArray(D.registryNotes))miss.push('registryNotes (массив строк)');
  return miss;
}

/* ===== форматирование ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=n=>Math.round(n).toLocaleString('ru-RU');
const pc=n=>Math.round(n*100)+'%';
const fm=n=>((Math.abs(n)<5000?0:n)/1e6).toFixed(2).replace('.',',');     // млн ₽, значения меньше 5 тыс. показываются как 0
const d1=n=>n.toFixed(1).replace('.',',');
const pill=([c,t])=>`<span class="pill ${c}">${t}</span>`;
const thousands=n=>f0(n/1000)+' тыс. ₽';

function funCard(lbl,tag,main,unit,sub,st,act){return `<div class="card"><div class="lbl">${lbl}</div><div class="v num">${main}<small>${unit}</small></div><div>${pill(st)} <span class="tag" style="margin-left:4px">${tag}</span></div><div class="t">${sub}</div><div class="act">${act}</div></div>`;}

function render(D){
  const P=D.params, UC_VM=P.unitVm, UC_H=P.unitHours, FUND=P.fundHours, GOAL=P.goalVmPerHour;
  const ucs=(vm,h,parts)=>'<b>В условных единицах:</b> '+d1(vm/UC_VM)+' по ВМ (÷ '+thousands(UC_VM)+'), '+d1(h/UC_H)+' по часам (÷ '+f0(UC_H)+' ч). <span class="sub2">Деталей справочно: '+parts+'.</span>';
  const ld=h=>'Загрузка '+f0(h)+' ч в месяц, '+(h/FUND*100).toFixed(0)+'% фонда';
  const kp=D.kpOpen, kvm=kp.reduce((s,r)=>s+r.vm,0), kh=kp.reduce((s,r)=>s+r.hours,0);
  const q=D.requests, km=D.kpIssuedMonth, n=D.nominationsMonth, p=D.pppMonth;
  const conv=D.conversion.kpIssuedVm>0?D.conversion.nominationsVm/D.conversion.kpIssuedVm:0;
  const win=P.convWindowMonths+' мес';
  const sSt=kvm>=P.stockNormVm?['good','Запас выше нормы']:['warn','Запас ниже нормы'];

  document.getElementById('title').textContent=D.meta.title;
  document.getElementById('subtitle').textContent='Срез на '+D.meta.asOf+'. Все показатели в валовой марже (ВМ), ₽ в месяц.';
  const stub=document.getElementById('stub');stub.hidden=!D.meta.isStub;
  stub.innerHTML='<b>Заглушка.</b> Источник данных не подключён. Цифры и строки условные, они показывают состав страницы. Запросы и КП без ответа показаны срезом на дату, остальные стадии — за месяц. Норма запаса воронки: от '+fm(P.stockNormVm)+' млн ₽ ВМ в месяц.';

  document.getElementById('f-cards').innerHTML=[
    funCard('В запросах','срез на '+D.meta.asOf,fm(q.vm),' млн ₽/мес','ВМ потенциальная по калькуляциям. '+ld(q.hours)+'. Поступило за месяц: '+q.inflowParts+' деталей.',['na','Учёт'],ucs(q.vm,q.hours,q.parts)),
    funCard('В КП без ответа','срез на '+D.meta.asOf,fm(kvm),' млн ₽/мес','ВМ потенциальная. '+ld(kh)+'. Норма запаса от '+fm(P.stockNormVm)+' млн ₽.',sSt,ucs(kvm,kh,kp.length)),
    funCard('КП выдано','за месяц',fm(km.vm),' млн ₽/мес','ВМ по выданным КП. '+ld(km.hours)+'.',['na','Учёт'],ucs(km.vm,km.hours,km.parts)),
    funCard('Номинации','за месяц',fm(n.vm),' млн ₽/мес','Клиент сказал «да». '+ld(n.hours)+'.',['na','Учёт'],ucs(n.vm,n.hours,n.parts)),
    funCard('Переведено в ППП','за месяц',fm(p.vm),' млн ₽/мес','Проектный статус подготовки производства. '+ld(p.hours)+'.',['na','Учёт'],ucs(p.vm,p.hours,p.parts)),
    funCard('КП → номинация',win,pc(conv),'','ВМ номинаций ÷ ВМ выданных КП за '+win+', скользящие. Цена фиксируется в КП, поэтому база — КП.',['na','Учёт'],'<b>Основа расчёта:</b> валовая маржа по калькуляции, количество деталей не используется.')
  ].join('');

  document.getElementById('chart-sub').textContent='Млн ₽ ВМ в месяц, условная единица = '+thousands(UC_VM)+' ВМ или '+f0(UC_H)+' ч наладчика в месяц';
  const st=[['Запросы','срез',q.vm,q.hours],['КП без ответа','срез',kvm,kh],['Номинации','за месяц',n.vm,n.hours],['ППП','за месяц',p.vm,p.hours]];
  const W=Math.max(300,document.getElementById('f-chart').clientWidth||560), LB=W<500?120:150, bh=30, g=20, H=st.length*(bh+g), mx=Math.max(1,...st.map(r=>r[2]));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ВМ по этапам воронки">`;
  st.forEach((r,i)=>{const y=i*(bh+g), w=Math.max(4,(W-LB-150)*r[2]/mx);
    s+=`<text x="0" y="${y+bh/2-2}" style="fill:var(--ink)">${r[0]}</text><text x="0" y="${y+bh/2+11}">${r[1]}</text><rect x="${LB}" y="${y}" width="${w}" height="${bh}" rx="4" fill="var(--brand)" opacity="${1-i*.15}"><title>${r[0]}: ${fm(r[2])} млн ₽ в месяц</title></rect><text class="val" x="${LB+w+8}" y="${y+bh/2+4}">${fm(r[2])} млн ₽</text><text x="${LB+w+8+(W<500?0:76)}" y="${y+bh/2+(W<500?18:4)}" style="fill:var(--muted)">${d1(r[2]/UC_VM)} усл. ед.</text>`;});
  document.getElementById('f-chart').innerHTML='<div class="chart">'+s+'</svg></div>';

  document.getElementById('f-s').textContent=kp.length+' деталей, ВМ '+fm(kvm)+' млн ₽ в месяц, '+f0(kh)+' ч в месяц, '+d1(kvm/UC_VM)+' усл. ед.';
  let t='<table><thead><tr><th>Деталь</th><th>Канал</th><th class="r">Дней в КП</th><th class="r">ВМ, ₽ в месяц</th><th class="r">Часы в месяц</th><th class="r">Усл. ед. по ВМ</th><th class="r">ВМ на час, ₽/ч</th></tr></thead><tbody>';
  kp.slice().sort((x,y)=>y.daysInKp-x.daysInKp).forEach(r=>{const rate=r.hours>0?r.vm/r.hours:0;
    t+=`<tr><td>${esc(r.part)}</td><td>${esc(r.channel)}</td><td class="r">${r.daysInKp}</td><td class="r">${f0(r.vm)}</td><td class="r">${f0(r.hours)}</td><td class="r">${d1(r.vm/UC_VM)}</td><td class="r"><b>${r.hours>0?f0(rate):'—'}</b> ${rate>=GOAL?'<span class="tag g">≥ '+f0(GOAL)+'</span>':''}</td></tr>`;});
  document.getElementById('f-t').innerHTML=t+'</tbody></table>';
  document.getElementById('f-hint').textContent='ВМ в месяц и часы наладчика берутся из калькуляции детали при плановом объёме. ВМ на час сравнивается с целью '+f0(GOAL)+' ₽/ч. Часы показывают, какую часть фонда займут детали, если клиент скажет «да». Количество деталей справочное, главные показатели — ВМ и загрузка в часах.';
  document.getElementById('f-notes').innerHTML=D.registryNotes.map(x=>'<li>'+esc(x)+'</li>').join('');
}

function main(){
  const miss=validate(DATA), err=document.getElementById('err'), box=document.getElementById('content');
  if(miss.length){err.hidden=false;box.hidden=true;err.textContent='В DATA не хватает или неверны поля:\n• '+miss.join('\n• ');return;}
  err.hidden=true;box.hidden=false;render(DATA);
}
window.startFunnel = main;
let _rz;window.addEventListener('resize',()=>{if(!window._dashStarted)return;clearTimeout(_rz);_rz=setTimeout(main,150);});

</script>
<script type="module">
// ---------- AUTH (Planfix OAuth через Worker dashboard-seppra) ----------
import { PF } from "../auth.js";
window.PF = PF;
window.signOut = () => PF.signOut();

function showDashboard(user) {
  document.getElementById('authOverlay').style.display = 'none';
  const hu = document.getElementById('hdrUser');
  hu.style.display = 'flex';
  document.getElementById('userEmail').textContent = user.name || '';
  if (!window._dashStarted) {
    window._dashStarted = true;
    window.startFunnel();
  }
}

function showLogin() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('hdrUser').style.display = 'none';
}

PF.onChange(user => {
  if (user) showDashboard(user);
  else showLogin();
});
